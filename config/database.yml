default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: appointment_booking_development
  username: <%= ENV.fetch("DB_USERNAME", "venkey") %>
  password: <%= ENV.fetch("DB_PASSWORD", "venkey123") %>
  host: 127.0.0.1

test:
  <<: *default
  database: appointment_booking_test
  username: <%= ENV.fetch("DB_USERNAME", "venkey") %>
  password: <%= ENV.fetch("DB_PASSWORD", "9014300387") %>
  host: 127.0.0.1

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>

  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate

  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate

  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate