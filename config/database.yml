default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: appointment_booking_development
  username: postgres
  password: postgres
  host: 127.0.0.1

test:
  <<: *default
  database: appointment_booking_test
  username: postgres
  password: postgres
  host: 127.0.0.1

production:
  primary:
    <<: *default
    database: appointment_booking_production
  cable:
    <<: *default
    database: appointment_booking_cable_production
